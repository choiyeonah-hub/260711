<title>로또 번호 추첨기</title>
<style>
  :root {
    --primary: #cc785c;
    --primary-active: #a9583e;
    --primary-disabled: #e6dfd8;
    --ink: #141413;
    --body: #3d3d3a;
    --body-strong: #252523;
    --muted: #6c6a64;
    --muted-soft: #8e8b82;
    --hairline: #e6dfd8;
    --hairline-soft: #ebe6df;
    --canvas: #faf9f5;
    --surface-soft: #f5f0e8;
    --surface-card: #efe9de;
    --surface-cream-strong: #e8e0d2;
    --surface-dark: #181715;
    --surface-dark-elevated: #252320;
    --surface-dark-soft: #1f1e1b;
    --on-primary: #ffffff;
    --on-dark: #faf9f5;
    --on-dark-soft: #a09d96;

    --ball-y: #e8a55a;
    --ball-y-txt: #3d2707;
    --ball-b: #5db8a6;
    --ball-b-txt: #0d2c27;
    --ball-r: #cc785c;
    --ball-r-txt: #ffffff;
    --ball-g: #a09d96;
    --ball-g-txt: #201f1c;
    --ball-gr: #5db872;
    --ball-gr-txt: #0c2413;

    --font-display: "Cormorant Garamond", "Tiempos Headline", Garamond, "Times New Roman", serif;
    --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 64px 20px 96px;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 18px;
    height: 18px;
    color: var(--primary);
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(34px, 7vw, 48px);
    letter-spacing: -1px;
    line-height: 1.1;
    color: var(--ink);
    text-wrap: balance;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.55;
    max-width: 38ch;
  }

  .tray {
    position: relative;
    background:
      radial-gradient(ellipse 420px 180px at 50% 0%, var(--surface-dark-elevated), transparent 70%),
      var(--surface-dark);
    border-radius: 12px;
    padding: 36px 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 236px;
    justify-content: center;
    overflow: hidden;
  }

  @keyframes tray-flash {
    0% { box-shadow: 0 0 0 0 rgba(204,120,92,0); }
    35% { box-shadow: 0 0 46px 8px rgba(204,120,92,0.4); }
    100% { box-shadow: 0 0 0 0 rgba(204,120,92,0); }
  }
  .tray.flash { animation: tray-flash 0.7s ease-out; }

  .machine {
    position: relative;
    width: 190px;
    height: 110px;
  }
  .machine[hidden] { display: none; }

  .machine::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(250,249,245,0.18);
    border-radius: 9999px;
  }

  .mite {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 9999px;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.22);
    animation: tumble var(--dur, 1.2s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .mite { animation: none; }
  }
  @keyframes tumble {
    0% { transform: translate(0, 0); }
    50% { transform: translate(var(--x1, 20px), var(--y1, -20px)); }
    100% { transform: translate(var(--x2, -20px), var(--y2, 20px)); }
  }

  .stage-status {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--primary);
    min-height: 16px;
  }

  .balls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-items: center;
    min-height: 60px;
  }

  .placeholder {
    color: var(--on-dark-soft);
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  .plus {
    color: var(--on-dark-soft);
    font-size: 20px;
    font-weight: 300;
    align-self: center;
  }

  .ball {
    width: 54px;
    height: 54px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    background: var(--surface-dark-elevated);
    color: var(--on-dark-soft);
    box-shadow: inset 0 -10px 14px rgba(0,0,0,0.14);
  }

  .ball.flicker { filter: blur(0.3px); }

  @keyframes settle {
    0% { transform: scale(1.32); box-shadow: 0 0 0 10px rgba(204,120,92,0.4); }
    55% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(204,120,92,0); }
    100% { transform: scale(1); box-shadow: inset 0 -10px 14px rgba(0,0,0,0.14); }
  }
  .ball.settle { animation: settle 0.36s cubic-bezier(.3,1.6,.5,1); }
  @media (prefers-reduced-motion: reduce) {
    .ball.settle { animation: none; }
  }

  .ball.y { background: var(--ball-y); color: var(--ball-y-txt); }
  .ball.b { background: var(--ball-b); color: var(--ball-b-txt); }
  .ball.r { background: var(--ball-r); color: var(--ball-r-txt); }
  .ball.g { background: var(--ball-g); color: var(--ball-g-txt); }
  .ball.gr { background: var(--ball-gr); color: var(--ball-gr-txt); }

  .bonus-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bonus-label {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--on-dark-soft);
  }
  .bonus-label.hot { color: var(--primary); }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    font-family: var(--font-body);
    border: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
  }

  .draw-btn {
    flex: 1;
    height: 40px;
    padding: 12px 20px;
    border-radius: 8px;
    background: var(--primary);
    color: var(--on-primary);
    transition: background-color 0.12s ease;
  }
  .draw-btn:hover:not(:disabled) { background: var(--primary-active); }
  .draw-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .draw-btn:disabled { background: var(--primary-disabled); color: var(--muted-soft); cursor: not-allowed; }

  .icon-btn {
    height: 40px;
    padding: 12px 20px;
    border-radius: 8px;
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline);
  }
  .icon-btn[aria-pressed="true"] {
    background: var(--primary);
    color: var(--on-primary);
    border-color: var(--primary);
  }
  .icon-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .history {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .history-head h2 {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    font-weight: 500;
  }

  .clear-link {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    font-weight: 500;
    padding: 4px;
  }
  .clear-link:hover { color: var(--primary-active); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
  }

  .history-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 12px 16px;
  }

  .history-idx {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-soft);
    font-variant-numeric: tabular-nums;
    width: 24px;
    flex-shrink: 0;
  }

  .mini-balls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .mini-ball {
    width: 26px;
    height: 26px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .empty-hint {
    color: var(--muted-soft);
    font-size: 14px;
    text-align: center;
    padding: 16px 0;
  }

  .divider {
    height: 1px;
    background: var(--hairline);
    border: none;
    margin: 0;
  }

  .chat {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat-head h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.4px;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .chat-sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }

  .chat-log {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 460px;
    overflow-y: auto;
  }

  .bubble {
    max-width: 90%;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
  }

  .bubble-user {
    align-self: flex-end;
    background: rgba(204, 120, 92, 0.12);
    border: 1px solid rgba(204, 120, 92, 0.28);
    color: var(--ink);
  }

  .bubble-bot {
    align-self: flex-start;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    color: var(--body);
  }

  .bubble-bot.loading { color: var(--muted); }

  .pillars-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 2px 0 10px;
  }

  .pillar {
    background: var(--surface-dark);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
  }

  .pillar-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--on-dark-soft);
  }

  .pillar-value {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--on-dark);
    margin-top: 2px;
  }

  .element-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 0 0 10px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface-cream-strong);
    color: var(--ink);
  }

  .chip.dominant {
    background: var(--primary);
    color: var(--on-primary);
  }

  .bubble-blurb {
    margin: 0 0 12px;
  }

  .chat-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 16px;
  }

  .field-row {
    display: flex;
    gap: 10px;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .field-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .field input,
  .field select {
    height: 40px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    width: 100%;
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.15);
  }

  .chat-disclaimer {
    margin: 0;
    font-size: 12px;
    color: var(--muted-soft);
  }
</style>

<div class="stage">
  <header>
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 L12 22 M4.5 6 L19.5 18 M19.5 6 L4.5 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="eyebrow">Lotto 6 / 45</div>
    <h1>로또 번호 추첨기</h1>
    <p class="sub">버튼을 누르면 1부터 45까지 숫자 중 6개를 무작위로 뽑아드려요</p>
  </header>

  <div class="tray" id="tray">
    <div class="machine" id="machine" hidden></div>
    <div class="stage-status" id="stageStatus"></div>
    <div class="balls-row" id="ballsRow">
      <span class="placeholder" id="placeholder">추첨 버튼을 눌러보세요</span>
    </div>
    <div class="bonus-wrap" id="bonusWrap" style="display:none;">
      <span class="bonus-label" id="bonusLabel">보너스</span>
      <div class="balls-row" id="bonusRow" style="min-height:auto;"></div>
    </div>
  </div>

  <div class="controls">
    <button class="draw-btn" id="drawBtn">번호 추첨하기</button>
    <button class="icon-btn" id="bonusToggle" aria-pressed="false">보너스 번호</button>
  </div>

  <div class="history">
    <div class="history-head">
      <h2>이전 추첨 기록</h2>
      <button class="clear-link" id="clearBtn">기록 지우기</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-hint" id="emptyHint">아직 추첨 기록이 없어요</div>
    </div>
  </div>

  <hr class="divider" />

  <div class="chat">
    <div class="chat-head">
      <h2>사주로 번호 추천받기</h2>
      <p class="chat-sub">생년월일과 태어난 시간을 입력하면 사주를 분석해서 어울리는 번호를 추천해드려요</p>
    </div>

    <div class="chat-log" id="chatLog"></div>

    <form class="chat-form" id="chatForm">
      <div class="field-row">
        <label class="field">
          <span class="field-label">생년월일 (양력)</span>
          <input type="date" id="birthDate" required />
        </label>
        <label class="field">
          <span class="field-label">태어난 시간</span>
          <select id="birthTime">
            <option value="unknown">모름</option>
            <option value="23:00~00:59">23:00 ~ 00:59 (자시)</option>
            <option value="01:00~02:59">01:00 ~ 02:59 (축시)</option>
            <option value="03:00~04:59">03:00 ~ 04:59 (인시)</option>
            <option value="05:00~06:59">05:00 ~ 06:59 (묘시)</option>
            <option value="07:00~08:59">07:00 ~ 08:59 (진시)</option>
            <option value="09:00~10:59">09:00 ~ 10:59 (사시)</option>
            <option value="11:00~12:59">11:00 ~ 12:59 (오시)</option>
            <option value="13:00~14:59">13:00 ~ 14:59 (미시)</option>
            <option value="15:00~16:59">15:00 ~ 16:59 (신시)</option>
            <option value="17:00~18:59">17:00 ~ 18:59 (유시)</option>
            <option value="19:00~20:59">19:00 ~ 20:59 (술시)</option>
            <option value="21:00~22:59">21:00 ~ 22:59 (해시)</option>
          </select>
        </label>
      </div>
      <button type="submit" class="draw-btn" id="sajuBtn">사주 분석하기</button>
      <p class="chat-disclaimer">재미로 보는 사주풀이예요. gpt-5.4-mini가 간지를 계산하고 해석합니다.</p>
    </form>
  </div>
</div>

<script>
  const tray = document.getElementById('tray');
  const machine = document.getElementById('machine');
  const stageStatus = document.getElementById('stageStatus');
  const ballsRow = document.getElementById('ballsRow');
  const bonusRow = document.getElementById('bonusRow');
  const bonusWrap = document.getElementById('bonusWrap');
  const bonusLabel = document.getElementById('bonusLabel');
  const bonusToggle = document.getElementById('bonusToggle');
  const drawBtn = document.getElementById('drawBtn');
  const historyList = document.getElementById('historyList');
  const emptyHint = document.getElementById('emptyHint');
  const clearBtn = document.getElementById('clearBtn');

  let useBonus = false;
  let isDrawing = false;
  let history = [];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function colorClass(n) {
    if (n <= 10) return 'y';
    if (n <= 20) return 'b';
    if (n <= 30) return 'r';
    if (n <= 40) return 'g';
    return 'gr';
  }

  function drawUnique(count, exclude) {
    const excluded = new Set(exclude || []);
    const pool = Array.from({ length: 45 }, (_, i) => i + 1).filter((n) => !excluded.has(n));
    const picked = [];
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked;
  }

  async function spinMachine(duration) {
    if (reduced) return;
    machine.hidden = false;
    machine.innerHTML = '';
    for (let i = 0; i < 14; i++) {
      const mite = document.createElement('div');
      mite.className = 'mite ' + colorClass(1 + Math.floor(Math.random() * 45));
      mite.style.setProperty('--dur', (0.9 + Math.random() * 0.7) + 's');
      mite.style.setProperty('--delay', (Math.random() * 0.4) + 's');
      mite.style.setProperty('--x1', (Math.random() * 140 - 70) + 'px');
      mite.style.setProperty('--y1', (Math.random() * 70 - 35) + 'px');
      mite.style.setProperty('--x2', (Math.random() * 140 - 70) + 'px');
      mite.style.setProperty('--y2', (Math.random() * 70 - 35) + 'px');
      machine.appendChild(mite);
    }
    await sleep(duration);
    machine.hidden = true;
    machine.innerHTML = '';
  }

  async function revealBall(container, finalNumber, big) {
    const el = document.createElement('div');
    el.className = 'ball flicker';
    el.dataset.number = String(finalNumber);
    el.textContent = '–';
    if (big) el.style.transform = 'scale(1.08)';
    container.appendChild(el);

    if (!reduced) {
      let elapsed = 0;
      const tick = 45;
      const flickerFor = 420;
      while (elapsed < flickerFor) {
        el.textContent = String(1 + Math.floor(Math.random() * 45));
        await sleep(tick);
        elapsed += tick;
      }
    }

    el.textContent = String(finalNumber);
    el.classList.remove('flicker');
    el.classList.add(colorClass(finalNumber));
    if (!reduced) {
      el.classList.add('settle');
      await sleep(340);
      el.classList.remove('settle');
    }
    return el;
  }

  function flipSort(container) {
    const balls = Array.from(container.children);
    if (reduced) {
      balls
        .slice()
        .sort((a, b) => Number(a.dataset.number) - Number(b.dataset.number))
        .forEach((b) => container.appendChild(b));
      return;
    }
    const firstRects = new Map(balls.map((b) => [b, b.getBoundingClientRect()]));
    const sorted = balls.slice().sort((a, b) => Number(a.dataset.number) - Number(b.dataset.number));
    sorted.forEach((b) => container.appendChild(b));
    sorted.forEach((b) => {
      const first = firstRects.get(b);
      const last = b.getBoundingClientRect();
      const dx = first.left - last.left;
      if (dx) {
        b.style.transition = 'none';
        b.style.transform = 'translateX(' + dx + 'px)';
        requestAnimationFrame(() => {
          b.style.transition = 'transform 0.45s cubic-bezier(.2,.7,.3,1)';
          b.style.transform = 'translateX(0)';
        });
      }
    });
  }

  function addHistory(numbers, bonus) {
    history.unshift({ numbers, bonus });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function makeMiniBall(n) {
    const el = document.createElement('div');
    el.className = 'mini-ball ' + colorClass(n);
    el.textContent = n;
    return el;
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.appendChild(emptyHint);
      return;
    }
    history.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'history-row';

      const idx = document.createElement('div');
      idx.className = 'history-idx';
      idx.textContent = '#' + (history.length - i);
      row.appendChild(idx);

      const mini = document.createElement('div');
      mini.className = 'mini-balls';
      entry.numbers.forEach((n) => mini.appendChild(makeMiniBall(n)));
      if (entry.bonus !== undefined) {
        const plus = document.createElement('span');
        plus.className = 'plus';
        plus.style.fontSize = '14px';
        plus.style.color = 'var(--muted-soft)';
        plus.textContent = '+';
        mini.appendChild(plus);
        mini.appendChild(makeMiniBall(entry.bonus));
      }
      row.appendChild(mini);
      historyList.appendChild(row);
    });
  }

  async function runDraw() {
    if (isDrawing) return;
    isDrawing = true;
    drawBtn.disabled = true;
    bonusToggle.disabled = true;
    drawBtn.textContent = '추첨 중...';

    ballsRow.innerHTML = '';
    bonusRow.innerHTML = '';
    bonusWrap.style.display = 'none';
    bonusLabel.classList.remove('hot');

    stageStatus.textContent = '번호를 섞는 중...';
    await spinMachine(1000);

    const drawOrder = drawUnique(6);
    stageStatus.textContent = '';

    for (let i = 0; i < drawOrder.length; i++) {
      stageStatus.textContent = (i + 1) + '번째 공 추첨 중...';
      await revealBall(ballsRow, drawOrder[i], false);
      if (!reduced) await sleep(140);
    }

    stageStatus.textContent = '번호 정렬 중...';
    flipSort(ballsRow);
    await sleep(reduced ? 0 : 480);
    stageStatus.textContent = '';

    let bonusNumber;
    if (useBonus) {
      bonusWrap.style.display = 'flex';
      bonusLabel.classList.add('hot');
      stageStatus.textContent = '보너스 번호 추첨 중...';
      bonusNumber = drawUnique(1, drawOrder)[0];
      await revealBall(bonusRow, bonusNumber, true);
      stageStatus.textContent = '';
    }

    tray.classList.add('flash');
    setTimeout(() => tray.classList.remove('flash'), 700);

    const sortedMain = drawOrder.slice().sort((a, b) => a - b);
    addHistory(sortedMain, bonusNumber);

    drawBtn.disabled = false;
    bonusToggle.disabled = false;
    drawBtn.textContent = '번호 추첨하기';
    isDrawing = false;
  }

  drawBtn.addEventListener('click', runDraw);

  bonusToggle.addEventListener('click', () => {
    if (isDrawing) return;
    useBonus = !useBonus;
    bonusToggle.setAttribute('aria-pressed', String(useBonus));
  });

  clearBtn.addEventListener('click', () => {
    if (isDrawing) return;
    history = [];
    renderHistory();
  });

  const chatLog = document.getElementById('chatLog');
  const chatForm = document.getElementById('chatForm');
  const birthDateInput = document.getElementById('birthDate');
  const birthTimeSelect = document.getElementById('birthTime');
  const sajuBtn = document.getElementById('sajuBtn');

  const ELEMENT_ORDER = ['목', '화', '토', '금', '수'];
  const PILLAR_LABELS = [
    ['year', '년주'],
    ['month', '월주'],
    ['day', '일주'],
    ['hour', '시주'],
  ];

  function timeLabel(value) {
    if (!value || value === 'unknown') return '모름';
    const opt = birthTimeSelect.querySelector('option[value="' + value + '"]');
    return opt ? opt.textContent : value;
  }

  function addUserBubble(text) {
    const el = document.createElement('div');
    el.className = 'bubble bubble-user';
    el.textContent = text;
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
    return el;
  }

  function addBotBubble(text) {
    const el = document.createElement('div');
    el.className = 'bubble bubble-bot loading';
    el.textContent = text;
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
    return el;
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (sajuBtn.disabled) return;

    const birthDate = birthDateInput.value;
    if (!birthDate) return;
    const birthTime = birthTimeSelect.value;

    sajuBtn.disabled = true;
    sajuBtn.textContent = '분석 중...';

    addUserBubble(birthDate + ' · 태어난 시간 ' + timeLabel(birthTime));
    const botBubble = addBotBubble('사주를 분석하는 중...');

    try {
      const resp = await fetch('/api/saju', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ birthDate, birthTime }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '분석에 실패했습니다.');

      botBubble.className = 'bubble bubble-bot';
      botBubble.textContent = '';

      if (data.pillars) {
        const grid = document.createElement('div');
        grid.className = 'pillars-grid';
        PILLAR_LABELS.forEach(([key, label]) => {
          const cell = document.createElement('div');
          cell.className = 'pillar';
          const lab = document.createElement('div');
          lab.className = 'pillar-label';
          lab.textContent = label;
          const val = document.createElement('div');
          val.className = 'pillar-value';
          val.textContent = data.pillars[key] || '−';
          cell.appendChild(lab);
          cell.appendChild(val);
          grid.appendChild(cell);
        });
        botBubble.appendChild(grid);
      }

      if (data.elementCounts) {
        const chips = document.createElement('div');
        chips.className = 'element-chips';
        ELEMENT_ORDER.forEach((el) => {
          const chip = document.createElement('span');
          chip.className = 'chip' + (el === data.dominantElement ? ' dominant' : '');
          chip.textContent = el + ' ' + (data.elementCounts[el] || 0);
          chips.appendChild(chip);
        });
        botBubble.appendChild(chips);
      }

      const blurb = document.createElement('p');
      blurb.className = 'bubble-blurb';
      blurb.textContent = data.blurb || '';
      botBubble.appendChild(blurb);

      const resultRow = document.createElement('div');
      resultRow.className = 'balls-row';
      resultRow.style.minHeight = 'auto';
      botBubble.appendChild(resultRow);
      chatLog.scrollTop = chatLog.scrollHeight;

      const numbers = Array.isArray(data.numbers) ? data.numbers : [];
      for (const n of numbers) {
        await revealBall(resultRow, n, false);
        chatLog.scrollTop = chatLog.scrollHeight;
        if (!reduced) await sleep(120);
      }

      if (numbers.length) {
        addHistory(numbers.slice().sort((a, b) => a - b));
      }
    } catch (err) {
      botBubble.className = 'bubble bubble-bot';
      botBubble.textContent = '앗, ' + (err.message || '분석 중 문제가 발생했어요.') + ' 잠시 후 다시 시도해주세요.';
    } finally {
      sajuBtn.disabled = false;
      sajuBtn.textContent = '사주 분석하기';
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  });
</script>
